name: Wiki Issue Auto-Labeler

on:
  issues:
    types: [opened, edited]

permissions:
  issues: write

jobs:
  inspect-title:
    name: Inspect Issue Title
    runs-on: ubuntu-latest
    outputs:
      should_label: ${{ steps.check.outputs.should_label }}
    steps:
      - name: Check title prefix
        id: check
        run: |
          title="${{ github.event.issue.title }}"
          if [[ "$title" == Wiki:\ * || "$title" == Wiki\ Change:\ * ]]; then
            echo "should_label=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_label=false" >> "$GITHUB_OUTPUT"
          fi

  apply-label:
    name: Apply Wiki Label
    needs: inspect-title
    if: needs.inspect-title.outputs.should_label == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Add Wiki label
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              labels: ["Wiki"]
            });

  report:
    name: Report Outcome
    needs: [inspect-title, apply-label]
    runs-on: ubuntu-latest
    steps:
      - name: Summary
        run: |
          echo "Issue title matched wiki rules: ${{ needs.inspect-title.outputs.should_label }}"
