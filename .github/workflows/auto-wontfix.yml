name: Auto-label wontfix issues

on:
  issues:
    types: [closed]

permissions:
  issues: write

jobs:
  check-wontfix:
    name: Check wontfix reason
    runs-on: ubuntu-latest
    outputs:
      should_label: ${{ steps.check.outputs.should_label }}

    steps:
      - name: Check issue state reason
        id: check
        run: |
          if [ "${{ github.event.issue.state_reason }}" = "wontfix" ]; then
            echo "should_label=true" >> $GITHUB_OUTPUT
          else
            echo "should_label=false" >> $GITHUB_OUTPUT
          fi

  label-wontfix:
    name: Apply wontfix label
    needs: check-wontfix
    if: needs.check-wontfix.outputs.should_label == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Add wontfix label
        uses: actions/github-script@v7
        with:
          script: |
            const labels = context.payload.issue.labels.map(l => l.name);

            if (!labels.includes('wontfix')) {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                labels: ['wontfix'],
              });
            }
