name: RenPy Lint Pipeline

on:
  push:
    paths:
      - "**/*.rpy"
  pull_request:
    paths:
      - "**/*.rpy"
  workflow_dispatch:

jobs:
  setup-python:
    name: Setup Python Environment
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

  fetch-renpy:
    name: Download RenPy SDK
    runs-on: ubuntu-latest
    needs: setup-python
    steps:
      - name: Download RenPy SDK
        run: |
          wget https://www.renpy.org/dl/8.2.1/renpy-8.2.1-sdk.tar.bz2

      - name: Upload RenPy SDK Artifact
        uses: actions/upload-artifact@v3
        with:
          name: renpy-sdk
          path: renpy-8.2.1-sdk.tar.bz2

  unzip-renpy:
    name: Extract RenPy SDK
    runs-on: ubuntu-latest
    needs: fetch-renpy
    steps:
      - name: Download SDK Artifact
        uses: actions/download-artifact@v3
        with:
          name: renpy-sdk

      - name: Extract SDK
        run: |
          tar -xjf renpy-8.2.1-sdk.tar.bz2

      - name: Upload Extracted SDK Artifact
        uses: actions/upload-artifact@v3
        with:
          name: renpy-sdk-extracted
          path: renpy-8.2.1-sdk

  renpy-lint:
    name: Run RenPy Lint
    runs-on: ubuntu-latest
    needs: unzip-renpy
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download Extracted SDK Artifact
        uses: actions/download-artifact@v3
        with:
          name: renpy-sdk-extracted

      - name: Execute Lint
        run: |
          cd renpy-8.2.1-sdk
          ./renpy.sh $GITHUB_WORKSPACE lint

  fast-rpy-scan:
    name: Fast Syntax Scan
    runs-on: ubuntu-latest
    needs: unzip-renpy
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download Extracted SDK Artifact
        uses: actions/download-artifact@v3
        with:
          name: renpy-sdk-extracted

      - name: Quick Syntax Check
        run: |
          echo "Scanning .rpy files..."
          for file in $(find . -name "*.rpy"); do
            echo "Checking $file"
            python -m py_compile "$file" || exit 1
          done
