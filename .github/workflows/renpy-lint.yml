name: Ren'Py Linter

on:
  push:
    paths:
      - "**/*.rpy"
  pull_request:
    paths:
      - "**/*.rpy"
  workflow_dispatch:

jobs:
  setup-python:
    name: 🐍 Set up Python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

  fetch-renpy:
    name: 📥 Fetch Ren'Py
    runs-on: ubuntu-latest
    needs: setup-python
    steps:
      - uses: actions/checkout@v4

      - name: Download Ren'Py SDK
        run: |
          wget https://www.renpy.org/dl/8.2.1/renpy-8.2.1-sdk.tar.bz2

  unzip-renpy:
    name: 📦 Unzip Ren'Py
    runs-on: ubuntu-latest
    needs: fetch-renpy
    steps:
      - uses: actions/checkout@v4

      - name: Extract SDK
        run: |
          tar -xjf renpy-8.2.1-sdk.tar.bz2

  renpy-lint:
    name: 🔍 Run Ren'Py Lint
    runs-on: ubuntu-latest
    needs: unzip-renpy
    steps:
      - uses: actions/checkout@v4

      - name: Lint scripts
        run: |
          cd renpy-8.2.1-sdk
          ./renpy.sh $GITHUB_WORKSPACE lint

  rpy-fast-scan:
    name: ⚡ Fast .rpy Scan
    runs-on: ubuntu-latest
    needs: unzip-renpy
    steps:
      - uses: actions/checkout@v4

      - name: Basic syntax sanity check
        run: |
          echo "Scanning .rpy files..."
          for file in $(find . -name "*.rpy"); do
            echo "Checking $file"
            python -m py_compile "$file" || exit 1
          done
